name: Build production loop images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate bundle
        run: |
          python -m pip install numpy==2.2.6 Pillow==11.3.0
          python scripts/prepare_workflows.py --check
          python scripts/validate_assets.py
          python -m compileall -q scripts tests custom_nodes
          python -m unittest discover -s tests -v
          node --check custom_nodes/ComfyUI-WanLoopBatch/web/wan_loop_batch.js
          node --check custom_nodes/ComfyUI-WanLoopBatch/web/wan_loop_prompt_parser.mjs
          node tests/test_prompt_parser.mjs
          bash -n scripts/common.sh scripts/install_custom_nodes.sh scripts/start.sh scripts/container_smoke.sh

  build:
    name: ${{ matrix.profile }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - profile: loop-ada-cu128
            base_image: runpod/comfyui:1.4.4-cuda12.8@sha256:7078f94dbe28d079c487c245dc3524443e2c6225a6208a1fff8c7a652c1b3a40
            torch: 2.10.0+cu128
            torchvision: 0.25.0+cu128
            torchaudio: 2.10.0+cu128
            cuda: "12.8"
            gpu_family: ada
            image_tags: |
              ghcr.io/${{ github.repository }}:loop-ada-cu128
              ghcr.io/${{ github.repository }}:loop-ada-cu128-sha-${{ github.sha }}
          - profile: loop-blackwell-cu130
            base_image: runpod/comfyui:1.4.4-cuda13.0@sha256:949b0688db0692b97b9aab9efd1c8f5afe94cfaa32c32008f31bcafcff63baf1
            torch: 2.10.0+cu130
            torchvision: 0.25.0+cu130
            torchaudio: 2.10.0+cu130
            cuda: "13.0"
            gpu_family: blackwell
            image_tags: |
              ghcr.io/${{ github.repository }}:loop-blackwell-cu130
              ghcr.io/${{ github.repository }}:loop-blackwell-cu130-sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, smoke-test, and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.loop
          platforms: linux/amd64
          push: true
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-${{ matrix.profile }}
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-${{ matrix.profile }},mode=max,image-manifest=true,oci-mediatypes=true
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
            EXPECTED_TORCH_VERSION=${{ matrix.torch }}
            EXPECTED_TORCHVISION_VERSION=${{ matrix.torchvision }}
            EXPECTED_TORCHAUDIO_VERSION=${{ matrix.torchaudio }}
            EXPECTED_TORCH_CUDA=${{ matrix.cuda }}
            WAN_GPU_FAMILY=${{ matrix.gpu_family }}
            IMAGE_PROFILE=${{ matrix.profile }}
            BUNDLE_REVISION=${{ github.sha }}
          tags: ${{ matrix.image_tags }}
