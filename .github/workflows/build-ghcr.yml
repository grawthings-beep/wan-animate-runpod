name: Build GHCR image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight test dependency
        run: python -m pip install numpy==2.2.6

      - name: Validate generated workflows and asset manifest
        run: |
          python scripts/prepare_workflows.py --check
          python scripts/validate_assets.py
          python -m compileall -q scripts tests custom_nodes
          python -m unittest discover -s tests -v
          node --check custom_nodes/ComfyUI-WanLoopBatch/web/wan_loop_batch.js
          bash -n scripts/common.sh scripts/install_custom_nodes.sh scripts/start.sh

  build:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: loop
            node_manifest: custom_nodes.loop.txt
            image_tags: |
              ghcr.io/${{ github.repository }}:wan22-loop-fast
              ghcr.io/${{ github.repository }}:loop-sha-${{ github.sha }}
          - profile: full
            node_manifest: custom_nodes.txt
            image_tags: |
              ghcr.io/${{ github.repository }}:latest
              ghcr.io/${{ github.repository }}:cuda12.8
              ghcr.io/${{ github.repository }}:wan22-smooth-v6
              ghcr.io/${{ github.repository }}:wan22-lightning-longvideo
              ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max,scope=${{ matrix.profile }}
          build-args: |
            BUNDLE_REVISION=${{ github.sha }}
            CUSTOM_NODES_MANIFEST=${{ matrix.node_manifest }}
            IMAGE_PROFILE=${{ matrix.profile }}
          tags: ${{ matrix.image_tags }}
