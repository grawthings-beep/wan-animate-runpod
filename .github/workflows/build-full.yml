name: Build legacy full image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push manual AIO image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-full
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-full,mode=max,image-manifest=true,oci-mediatypes=true
          build-args: |
            BUNDLE_REVISION=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:full-cu128
            ghcr.io/${{ github.repository }}:full-cu128-sha-${{ github.sha }}
